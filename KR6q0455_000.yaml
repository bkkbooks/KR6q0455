front:
  text: 斷愚大師語録序拈花之旨雲廓天布揚光續焰代不乏人惟南嶽至臨濟獨名正傳而宗風大振於虎丘隆盛於徑山範而範之嫡嗣曰斷橋倫祖倫十四傳為普明用祖我永正法叔一老和尚乃普明嫡子敬嚴祖道弘闡大猷座下親炙磨光多至一二十秋未輒放行今法兄斷愚大師得骨得髓為永正墮地獅兒恂恂篤實事師孝謹其自處固凜凜然若冰雪至于接物導生則又春風回大塊一木一草咸欣欣有得宜師囑纍之偈有嚴持戒律若冰霜竭盡忠心輔祖綱之句所由然矣及讀退菴語録則一一胸襟流出妙在殺活縱橫超脫自在絶不蹈襲行過舊徑出一言著著有為人爪牙吐一句的的示衲僧家作略與學者抽釘拔楔奪食驅耕如九轉靈丹立地令人轉凡成聖若非深徹乎源底則性海翻瀾波光際天詎能若是耶蓋此一莖花自瞿曇拈後數千餘稔擲在糞掃堆頭被我斷兄拾起舉似十方暗香觸鼻疏影撩人其誰為破顏者康熙庚戌仲秋己亥望旦瓶山法弟真本項謙敬題斷愚智禪師語録目次序卷上升座小參示衆機緣行實卷下頌古頌偈自讚
