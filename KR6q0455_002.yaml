龍象莫輕浮驀地親拈示群峰悉點頭拄杖宗風憑繼續日用任施為掃盡狐狼迹堂堂更有誰如意縱橫皆自適動轉總隨宜指出形山寶光明遍界輝禪板禪林遵警策海衆賴維持一擊虛空碎嚬呻獅子兒數珠拈來為道用提起示諸人直下知端的當陽一句親飲瓢衲僧親活計顏子似同流飽腹無餘事高懸拄杖頭斗笠千聖皆同備群英曷可虧團圞無縫罅日炙與風吹蒲團跏趺堪穩坐定慧作根基為報參禪者須明向上機茫鞋江山都歷遍到處不曾離揚在紅塵裏無人識得伊關中四威儀關中行沒途程飯後欣舒步翛然絶擊縈關中住無別務焚香閲古書何論朝於暮關中坐脣懶簸豎起鐵脊梁那管蒲團破關中臥衲被破鼻息任鼾齁從來無夢作十二時歌半夜子床頭鼠咬自家耳噓一聲咸入穴中心暗喜雞嗚丑眼開一物渾無有黑漫漫大地盡成獅子吼平旦寅拈香擇火示天真勤禮佛徹體清涼絶世塵日出卯生涯當處何曾少钁頭邊覆去翻來用不了食時辰飢火炎炎事最親炊黍甑野菜和羹勝美珍禺中巳花笑鳥啼無別旨閉篷門堪歎迷流隨境使日南午大地炎蒸何處躲一彈指豁開寶藏空今古日昳未蒲團敷坐如來地沒心情那有工夫間拭涕晡時申囊鉢蕭然不厭貧無價寶圓明皎潔亙隨身日入酉參徒莫怪無分剖秪粗拳直下知歸休外走黃昏戌一日功程方始畢更何為摩訶般若波羅蜜人定亥威音王佛今何在阿呵呵天上人間絶對待自讚成侍者請者漢別無伎倆惟能守拙退讓事師一點赤心應機秪拈白棒自欣禪律兼規學者難為近傍生平懶合時宜篤志深棲雲嶂僅留殘質愧先賢莫把渠儂為榜樣當湖佛弟子羽生屠行符敬梓
