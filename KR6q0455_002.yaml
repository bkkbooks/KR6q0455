body:
  text: 嗣法門人機輪等編頌古世尊初生指天指地獨稱尊攪動須彌海嶽昏不是韶陽行正令幾多賺入鬼家門世尊睹星才出娘胎示本顏明星一睹眼睛穿如來德相咸皆具夜半優曇火裡鮮世尊拈華拈華顧視豈無端百萬人天總自瞞金色頭陀重漏泄真風凜冽骨毛寒世尊升座老漢家風已顯然文殊何必又重宣當時若是英靈客肯向他山聽杜鵑世尊下忉利天栴檀像出迎高懸古鏡照無偏萬象森羅似宛然我也笑時渠也笑不如撲破絶媸妍世尊因文殊門外立熱心人惹是非多內外何曾有自他無角鐵牛耕海底懷胎石女唱巴歌世尊未離兜率已降王宮未出母胎度人已畢大巧若拙大智若愚四維上下無人識渠世尊因文殊出女子定不得一本桃林不假栽園丁何必強安排由來灼灼花夭艷秪在春風拂便開世尊因普眼菩薩欲見普賢兩次三番意正濃普賢不見許誰同依俙似曲才堪聽卻被風吹別調中世尊因乾闥婆王獻樂乾闥婆王奏樂時山河大地悉如斯電光石火難通信端的應須秪自知世尊因五通仙人問如何是那一通那一通你問我須彌倒卓日當午堪笑騎牛更覓牛分付禪流休莽鹵世尊因波斯匿王問勝義諦中有世俗諦否一二義諦水銀墮地逼塞虛空有甚巴鼻咄殃崛持鉢凍鎖寒梅一段香春風才拂便芬芳青山緑水仍如舊莫向枝頭較短長世尊因調達謗佛生身陷入地獄令阿難傳問三禪天樂自和諧其奈渾身個裡埋爭若奮然張意氣管教是處絶安排世尊臨入涅槃文殊請再轉法輪四十九年曾未説末稍再請復何宣法輪轉處難回避逼塞虛空遍大千天親菩薩自彌勒內宮而下無著菩薩問問處分明答處親緑陰枝上鳥啼春梵音清雅超凡聽不是其人豈易聞維摩居士因三十二菩薩問疾各説不二法門毗耶一默義偏雄不二門開觸處通夜半無燈香閣靜鞦韆垂在月明中迦葉尊者因阿難問世尊金襴外別傳何物金襴之外復何傳弟應兄呼倒剎竿佛眼直教窺不得兒孫由是逞顢頇圓覺一切障礙即究竟覺飯後茶三盞禪餘書幾行本無焦渴患何用樂清涼雙林善慧大士因梁武帝請講經一卷經文寶鏡明河沙妙義剎那評當時不得志公老未免人呼作白丁初祖自梁涉魏至少林面壁而坐九年冷坐少林前劈脊誰能下一拳不是神光親覷破一花那得至今傳二祖安心忘軀為法乞安心不識羞慚滿面塵卻被老胡輕一拶了然直下喪家珍馬祖升堂百丈捲席升堂捲席意相投脫體風流孰與酬昨日鼻疼今不痛分明舉似有來由南陽慧忠國師因代宗帝問百年後所須何事孤孤迥迥絶羅籠不假人間造作工秪為耽源饒舌後翻令描摸在朦朧丹霞因過慧林寺值凝寒乃取木佛燒火向滔天巨水涌江千短棹徒教望遠灘忽地風帆摧折後一鉤新月逼人寒南泉斬貓貓兒提起意分明剛刃揮時正令行叵耐群英都不薦草鞋頭戴為施呈魯祖凡見僧來便面壁南泉聞云池陽面壁也無端痛下金錐孰解看王老頂門加一拍從教血濺梵天寒石鞏接三平老將從來膽氣弘當場血戰愛英雄金鞭轉處乾坤黑降馬猶憐卸甲風國師三喚侍者三呼三應墨中煤玉斧金刀劈不開負汝負吾重剖析依然滿面是塵埃藥山因李翱刺史訪雲在青天水在瓶應知此道出常情渠儂自得看經趣換卻時人眼裡睛德山托鉢詐啞裝聾老德山墻歪戶裂實難關家私卻被傍人見醜態相傳覺赧顏臨濟在黃檗三度問佛法大意三頓烏藤恨未休大愚一點豁雙眸歸來便把虎鬚捋倒嶽旋嵐出衆儔布袋和尚嘗拖布袋在通衢狼藉家私孰識渠世界大千都著盡更為拈出示無餘趙州因僧問如何是和尚家風家風才舉便郎當逐塊禪流又著忙覿面不知千里隔如何洞見黑心腸古德不出方丈到莊喫油餈齋時獨不赴雲堂也是無端著死忙幸自子期能解會高山流水別宮商趙州喚文遠東司頭上高高喚步下輕輕應一聲此話已經人落耳長江有水洗難清子湖狗子湖堂前蓄隻狗藏頭露尾誰知有從來不顧親與疏擬議遭他秪一口南泉因趙州問如何是道平常心是道白布休粘皂倦即便噇眠寒來添衲襖趙州因僧問萬法歸一佛祖從來説不到盡情抖擻與諸人明明那事無今古日照青峰朵朵新雪峰因三聖問透網金鱗金鱗透網絶羈留誰敢揚帆下餌鉤不是拏雲擒霧手何當倒嶽與傾湫臨濟囑三聖偈沿流不止問如何殃及兒孫會也麼耀古騰今難蓋覆一輪皎潔印千波真照無邊説似他當機直指絶淆訛洪鐘扣發驚群夢石臼風吹念佛陀離相離名人不稟鐵牛夜半過窗櫺堪憐無限參玄客錯認胡蘆作帝瓶吹毛用了急須磨閃爍寒光孰奈何奮怒那吒才觸犯血流滿地罷干戈趙州因僧問狗子還有佛性也無狗子佛性有無鐵蛇橫在當途瞎眼波斯踏著管教喪卻全軀臨濟上堂僧出作禮濟便喝僧曰老和尚莫探頭好濟曰你道落在什麼處僧便喝濟便打又僧問如何是佛法大意濟便喝僧作禮濟曰你道好喝也無僧曰草賊大敗濟曰過在什麼處僧曰再犯不容濟便打乃曰大衆要會臨濟賓主句問取堂中二禪客賓主交參殺活全奔流度刃火中蓮堂中禪客分明示誰道渠儂是白拈趙州訪二菴主竿木隨身逢場作戲放去收來衲僧巴鼻香嚴示衆若論此事如人上樹一等全提向上機無錐地漢做來奇當場不畏傍觀眼別有威聲動四維鼓山折箭中途箭折有來由誰料奴渠語更優大抵還他肌骨好不風流處也風流寶壽第二世見相打曰得恁麼無面目遂大悟浩浩塵中渾不覺一拳打著脫然空森羅萬象齊顛首依舊扶桑涌日紅保福四謾人卻是你謾我賊身淨裸裸誰知陝府牛吞卻嘉州虎趙州因僧問承聞和尚親見南泉是否南泉親見不謾人蘿蔔拈來直指陳大塊秋毫非別物千紅萬紫總皆春九峰勘首座枯木堂前花正春炷香脫去未為真一條白練如龍活賺殺參玄幾許人雲門上堂乾坤之內當陽拈出形山寶燦地輝天遍界彰坐臥經行如不薦燈籠佛殿漫摶量船子覆舟沒蹤迹處莫藏身二十年明此事親呈起橈來無別有踏翻船子脫然新趙州勘婆子婆子掀翻滄海去趙州踢倒須彌回奈我一雙窮相手未曾容易舞三臺法眼示衆者裡聚集少時為上座僧堂裡者裡聚集少時為上座山門頭者裡聚集少時為上座寮舍裡為復説上座過別有道理山門寮舍與僧堂覿面全提不覆藏奼女已歸霄漢去呆郎猶自守空房臨濟四料揀煙塵掃盡顯朝綱萬疊江山總大唐一片皇風無內外謳歌鼓腹滿邊疆興化因僧問四方八面來時如何戴角擎頭捋虎鬚當機直指絶離微重拈古廟藏身處賺殺平人犯夜歸三界唯心萬法唯識一二三四五五四三二一久拋搕𢶍頭拈起無倫匹趙州問僧曾到此間麼相逢秪喚喫杯茶沾著通身徹骨麻伶俐衲僧多意氣管教別有好生涯興化在大覺為院主杖頭豪氣孰同儕撥轉機輪當下灰一炷香焚恩不負孤賒捉敗古今該南院上堂赤肉團上壁立千仞絶遮攔處復遮攔獲下南洲小洞蠻赫赫旌旗揮轉處滿天愁霧鎖青山龍濟示衆是柱不見柱非柱不見柱云飢來喫飯困來眠兩腳長伸得自然若把是非來辨我知君猶欠喫粗拳風穴升座顧視大衆首山便下去穴便歸方丈才登寶座揚家醜爭奈傍觀不耐看一把柳絲收不得和煙搭在玉欄杆首山竹篦赫赫全提驗棟材堂堂大用出塵埃兩頭坐斷未相許更擬如何劈脊揮慈明參汾陽經二年未許入室倒腹傾腸舉似人其如不薦屈難伸一朝捉敗非輕處眼蓋乾坤氣宇新天衣懷禪師示衆百骸俱潰散一物鎮常靈百骸潰散皆歸土一物常靈何處安秋來葉落總歸根春至花開遍界新一片寒心付流水不知幾是報恩人五祖謝監收上堂人之性命第一須是欲得成此先須防於若是真人重重分付最殷勤演祖何曾動嘴脣若向此中窮徹骨方堪攜手入廛陳古云大智發於心於心何處尋成就一切義無古亦無今有有有中無無無無中有猴愁摟搜頭狗走抖擻口杭州淨慈斷橋妙倫禪師參無準和尚準以狗子因何有業識令下語凡三十轉皆不契倫云可無方便乎準乃舉真淨頌曰言有業識在誰云意不深海枯終見底人死不知心示之倫悚然良久忽聞板聲大悟一擊通身脫誰為業識來真燈從此續烜赫耀無涯古德六刮塵毛除去眼中花皮肉蠲來未足誇髓骨直教都刮盡爭如隨分納些些天台瑞巖方山寶禪師參斷橋倫祖祖室中嘗舉萬法歸一示徒一日寶侍次祖拈莧菜根示之寶忽大悟等間拈示有來由瞥爾知恩便徹頭正眼豁開凡聖盡兒孫遞代逞風流瑞巖寶禪師因無見睹參便打睹一日作務次豁然大悟遂呈偈曰選佛甲科喜莫量大千沙界一禪床嗔拳痛棒知多少今日恩忘怨亦忘寶以偈印之傾杯空著本無意卻還錢坐斷華峰頂真風播御簾天台華頂無見睹禪師四十年足不越閫至正賜號妙明真覺白雲度問西來密意未審如何頂曰待娑羅峰點頭即向汝道雲於言下大悟梗將生鐵錘捏出黃金汁寄語長安人莫把長安覓南京大岡月溪澄禪師凡見僧請益乃曰佛法不是鮮魚怕爛卻那即趁出夷峰寧侍傍大悟栗棘金圈事絶倫何期室內有知音都緣惡辣難棲泊留得丹心煥古今繡州天寧法舟道濟禪師因五臺陸公問畫前元有易否寧曰若無將什麼畫公曰畫後如何寧曰元無一畫公曰現有六十四卦何得言無寧曰居士莫著文字好公曰請師離文字發一爻看寧召五臺臺應諾寧曰者一爻從何處起鴛鴦重繡出暗地度金針曲盡千般妙全拋一片心繡州敬畏無趣如空禪師元旦示衆日今日新年第一日圓明普照恆沙國群靈咸在此光中皆得如來三昧力汝等還會如來力麼以兩手作掇石勢云遏拙來時有僧問重多少趣曰飯袋子輕重也不知當陽直示本無私懞懂禪流尚不知見徹老人垂手處方為出格丈夫兒杭州徑山無幻性沖禪師因編無趣録歸趣曰子一向做得個什麼山曰性沖買得一段田收得原本契書請和尚簽押遂將録呈上趣接得曰者個是我底你底聻山曰和尚莫攙行奪市趣擲下録本山便出水乳機投非分外分疆立界太無端兒孫幸得今朝力萬國春風一統看無幻和尚因僧問如何是提婆宗幻曰一字不著劃僧云某甲不問者個幻曰圓相不著圈崑崙顛倒舞北斗面南看不遇知音者徒勞話歲寒無幻和尚燒火次僧問如何是自性天真佛幻曰與我搬取一束柴來僧搬柴了又埋前問幻曰者奴子好惡也不知便打自性天真佛云何向外求當機如委悉恩大莫能酬嘉興興善南明慧廣禪師時徑山為首衆一日地上拾片紙視之有觀方知彼去去者不至方之句忽大悟乃白幻幻印可搕𢶍堆頭親撞著面門從此得昂藏五峰頂上烹英傑一段真風萬古揚南明和尚徑山示衆曰五峰頭卓朔雙徑尾顛先喝石巖一任𨁝跳明月池覆地傾天此四句中有一句有殺人刀無活人劍有一句有活人劍無殺人刀有一句殺人刀活人劍俱有有一句殺人刀活人劍俱無揀點得倜儻分明許你參學事畢獅子咆哮自出群驚翻海嶽震乾坤佛魔到此無蹤迹野犴徒教裂頂門南明和尚因聞谷大師問了即業障本來空未了應須償宿債獅子尊者因甚被罽賓國王斬卻南曰本來空聞云為什麼王臂自落南曰本來空聞云和尚意旨如何南曰本來空問處絶毫釐答處填溝壑捉敗老南翁始信乾坤廓錯出穴猛虎戴雙角建寧普明鴛湖妙用禪師謁湛然和尚問目前無法意在目前其旨如何湛曰聞令師出關是否明曰不是目前法非耳目之所到又作麼生湛揖曰請出我要止靜明便出作家相見果非常舒卷同時徹底揚更有一般奇特處任教天眼莫窺光普明老和尚同雪嶠大師上弦夜玩