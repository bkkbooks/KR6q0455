body:
  text: 嗣法門人機輪等編康熙甲辰臘月望日衆檀護請升座僧問如何是奪人不奪境師云徑僻遊郎絶林深月影遲進云如何是奪境不奪人師云芟除閒草木腳下迥無私進云如何是人境兩俱奪師云不存車馬跡豈立主賓儀進云如何是人境俱不奪師云客來呈舊面花落長新枝進云人境已蒙師指示向上宗乘事若何師便打進云恁麼則祖燈恆不墜烜赫利人天師云闍黎分上作麼生僧一喝便禮拜師復打乃云萬里無雲徹骨寒一輪紅日上層巒秪因檀護殷勤請勉向當陽露一斑遂舉拂子云會麼若喚者個作境要且蹉過山僧若喚者個作人爭奈不識拂子若喚者個作人境兩俱奪正如掩耳偷鈴若喚者個作人境俱不奪亦似空華病眼所以世尊說法四十九年末後靈山會上全提此事故初祖西來不立文字直指人心見性成佛復舉拂子云若向者裡擔荷得去恁麼也得不恁麼也得恁麼不恁麼總得天上有星皆拱北人間無水不朝東設或未然曹溪波浪如相似無限平人被陸沉拂一拂復舉斷橋倫祖上堂云荊山有玉獲得者不在荊山赤水有珠拾得者不在赤水衲僧有無位真人證得者出入不在面門驀拈拄杖橫按云會麼幽州江口石人蹲師云倫祖雖則提持親切顯發慈悲未免令人智境兩立退菴即不然荊山有玉獲得者妙淨瑩潔赤水有珠拾得者圓明洞徹衲僧有無位真人證得者出入本無途轍驀拈拄杖卓一下云會麼大地山河一片雪喝一喝下座誕日衆檀信設齊請升座僧問如何是賓中賓師云縱步踏紅塵進云如何是賓中主師云行行皇化裡進云如何是主中賓師云攜杖指迷津進云如何是主中主師云堂堂誰敢觸進云吾師誕日四衆雲臻向上一句又作麼生師便打進云恁麼則壽量超群象家風出衆儔師云汝更道看僧一喝歸衆師云拄杖子笑你在乃云有愧劬勞産我身欲酬罔極復何伸鐵牛踏破千山雪石女敲開不二門一著先天須委悉半肩碎衲漫疏親冰河焰起非常事枯木花開劫外春舉拂子云如是會得則遍界無蹤跡全身絶覆藏能為萬象主不逐四時忙千聖皆同證森羅共舉揚四恩咸可報三有悉蒙光便能拈一莖草作丈六金身將丈六金身作一莖草於無佛處現佛攝化有情以無法處說法令歸正覺轉山河國土歸自己淨盡無餘轉自己向山河國土縱橫自在全賓即主全主即賓然後一為無量無量為一塵塵爾剎剎爾如精金百煉赤體純真似皎月騰輝圓明無礙雖然猶未是空劫已前面目在秪如今日蒙衆慶誕一句且止作麼生是空劫已前面目復舉拂子云從來佛眼難窺覷透出威音更那邊喝一喝復舉長沙景岑禪師因僧問如何轉得山河國土歸自己去沙曰如何轉得自己成山河國土去僧曰不會沙曰湖南城下好養民米賤柴多足四鄰僧無語沙乃示偈曰誰問山河轉山河轉向誰圓通無兩畔法性本無歸師云岑老還丹不吝空施點鐵之功者僧其力未充徒有吞吳之志有問退菴如何轉得山河國土歸自己去即向他道恰好更問如何轉得自己成山河國土去亦對他道恰好若人透得者兩轉語不唯雙眼圓明管取丹霄獨步其或未然氣逼殺人卓拄杖一下下座升座舉德山一日飯遲托鉢至法堂因風起浪雪峰曰者老漢鐘未鳴鼓未響托鉢向甚麼處去當面蹉過山便低頭歸方丈藏身露影峰舉似巖頭納敗不少頭曰大小德山未會末後句在打草驚蛇山聞令侍者喚巖頭問汝不肯老僧那作賊人心虛頭密啓其意一釣便上山明日上堂果與尋常不同殺人刀活人劍頭曰且喜老漢會末後句塗污人不少雖然也秪得三年活伎倆已盡山果三年而歿疑殺天下人大衆者一隊漢總被退菴捉敗了也且作麼生是末後句驀拈拄杖卓一卓喝一喝云然雖如是更聽一偈因風起浪入雲堂一片婆心絶覆藏雪老惜乎已蹉過奯公多口妄施張低頭歸室全披露攜杖登壇重舉揚末後三年渾漏泄豁開宗眼漫摶量復卓拄杖下座升座僧問如何是退菴境師云古木沖霄漢煙霞達遠村進云如何是境中人師云覿體無回互當軒為指陳僧禮拜師便打問永正老人道寒灰當發焰枯木也花開是甚麼人分上事師便打進云恁麼則臨濟家聲振長溪面目新師云腳跟下更須喫棒僧便喝師復打乃舉南明和尚示衆云五峰頭卓朔雙徑尾顛先喝石巖一任𨁝跳明月池覆地傾天此四句中有一句有殺人刀無活人劍有一句有活人劍無殺人刀有一句殺人刀活人劍俱有有一句殺人刀活人劍俱無揀點得倜儻分明許你參學事畢師云退菴亦有四句舉似大衆非敢與南祖爭英貴圖兩彩一賽溪水翻銀浪庭梅笑晚香寒鴉鳴落日清罄響叢篁此四句中有一句有賓無主有一句有主無賓有一句賓主交參有一句賓主迥絶然雖如是要見南祖則易要見退菴則難若能撿辨得出秪可且居門外如或謬亂指陳何止白雲萬里設有個漢知得山僧恩入得山僧室正好朝打三千暮打八百且道山僧畢竟有何超卓驀拈拄杖云掀倒上重關捩子出頭天外更誰知卓一卓下座除夕小參僧問年窮歲盡時如何師云明日是新正進云恁麼則大家齊拱賀遍界樂升平也師云且緩緩僧一喝歸衆師云放你三十棒乃舉北禪智賢禪師曰年窮歲盡無可與諸人分歲老僧烹一頭露地白牛炊黍米飯煮野菜羹燒榾柮火大家喫了唱村田樂何故免見倚他門戶傍他墻剛被時人喚作郎下座歸方丈至夜深維那至方丈問訊曰縣裡有公人到賢曰作甚麼那曰道和尚宰牛不納皮角賢遂捋下頭帽擲地上那便拾去賢下禪床擒住曰賊賊那將帽覆賢頂曰天寒且還和尚賢呵呵大笑那出去時法昌為侍者賢顧昌曰者公案作麼生昌曰潭州紙貴一狀領過師云北禪雖則片片赤心未免傍觀者哂維那向虎頷下捋鬚也是陳後興兵唯有法昌較些子蝦跳不出斗總把龜毛繩子束向一邊子也退菴即不然家風淡泊無可與諸人分歲秪得麥飯黃虀喫了一任經行打坐何故卓拄杖云道泰不傳天子令時清休唱太平歌下座小參不用如何若何便請單刀直入有麼有麼一僧才出師劈脊便打僧云某甲話也未問因甚便打師云者漆桶話頭也不識僧喝師復打又僧出師亦打云且道者棒賞你罰你僧擬語師又打又僧出師打云討甚麼碗僧無語師亦打乃云若是伶俐漢道頭知尾便合休去何更要師家添鹽添醬適來僧才出山僧便打且道意在於何要汝等直下承當省力去何必登山涉險帶水拖泥出一叢林進一保社三根椽下七尺單前磨褌擦褲廢寢忘餐討許多生受喫卓拄杖云還委悉麼若委悉得始知釋迦不先彌勒不後達磨不來東土二祖不往西天若不委悉大有事在莫道山僧不道好復卓拄杖下座示衆佛誕示衆舉世尊初生一手指天一手指地周行七步目顧四方曰天上天下唯吾獨尊雲門曰我當時若見一棒打殺與狗子喫貴圖天下太平師云黃面瞿曇才生下地示大人相作獅子吼怎奈藏頭露尾雲門正令雖行要且腳跟未點地在退菴恁麼道還有為古人雪屈者麼卓拄杖云鶴有九皋難翥翼馬無千里漫追風示衆舉世尊靈山會上拈起一華顧視大衆時百萬人天盡皆罔措唯金色頭陀破顏微笑世尊曰吾有正法眼藏涅槃妙心實相無相微妙法門付囑摩訶迦葉師云世尊向虛空裡釘橛爭奈百萬人天不覺頂門痛尊者破顏微笑眼中著楔且道退菴又作麼生舉拂子云男兒自有沖天志豈向他人行處行示衆舉世尊升座大衆集定文殊白椎曰諦觀法王法法王法如是世尊便下座師云世尊大似一座須彌山子囫圇無縫卻被文殊一椎擊碎了也直得大地衆生髑髏敲磕且道退菴又作麼生舉拂子云將此深心奉塵剎是則名為報佛恩擊禪床便起示衆舉世尊在第六天說大集經敕他方此土人間天上一切獰惡鬼神悉皆集會受佛付囑擁護正法設有不赴者四天門王飛熱鐵輪追之令集既集會已無有不順佛敕者各發弘誓擁護正法唯有一魔王謂世尊曰瞿曇我待一切衆生成佛盡衆生界空無有衆生名字我乃發菩提心師云世尊休去雷音大震魔王將謂出一頭地殊不知弄巧成拙好與三十拄杖何故暗裡抽橫骨明中坐舌頭佛魔俱屏跡脫體自風流喝一喝示衆舉世尊示隨色摩尼珠問五方天王此珠而作何色時五方天王互說異色世尊藏珠復抬手曰此珠作何色天王曰佛手中無珠何處有色世尊曰汝何迷倒之甚吾將世珠示之便強說有青黃赤白色吾將真珠示之便總不知時五方天王悉自悟道師云大小世尊話作兩橛檢點將來猶缺慈悲雖然天王悟去堪作甚麼退菴若作世尊各與三十拄杖何也殺人刀活人劍示衆舉達磨大師一日命門人日時將至矣汝等盍各言所得乎時有道副對日如我所見不執文字不離文字而為道用祖曰汝得吾皮尼總持曰我今所解如慶喜見阿佛國一見更不再見祖曰汝得吾肉道育曰四大本空五陰非有如我見處無一法可當情祖曰汝得吾骨最後慧可出但禮拜依位而立祖曰汝得吾髓乃傳衣付法師云初祖昔年脫空謾語賺他個個承虛接響直饒二祖禮拜依位而立未免亦被塗污退菴既自為他兒孫且道有甚長處敢恁麼道擲拄杖云意氣不從天地得精金那復帶泥沙喝一喝便起示衆舉六祖大師曰吾有一物無頭無尾無名無字無背無面諸人還識麼神會出衆曰是諸法之本源神會之佛性師云六祖大師如將一口縵天網子撒向當陽了也可惜荷澤自甘投入若是退菴待恁麼道即便掀倒禪床喝散大衆不獨慶快平生亦使後昆盡皆灑灑落落遂作舞歸方丈示衆舉汾州無業禪師曰一毫頭聖凡情念未盡未免入驢胎馬腹裡去白雲端曰直饒一毫頭聖凡情念頓盡亦未免入驢胎馬腹裡去師云一人放行中把住一人把住中放行若也檢點得出一任驢胎馬腹裡得大自在其或未然切莫帶纍山僧好卓拄杖一下示衆舉水潦和尚問馬祖如何是西來的的意祖曰禮拜著潦拜下祖乃當胸踏倒潦忽契悟撫掌呵呵大笑曰也大奇也大奇百千三昧無量妙義秪向一毫頭上識得根源去住後每謂衆曰自從一喫馬師踏直至如今笑不休師拈拄杖召衆云若向者裡會去不惟省力要且看破水潦如或未然聽取一頌水潦參馬祖拜倒喫一踏百千妙義門從此都抹殺卓一下云不抹殺萬古清風無阻闔便起示衆舉趙州從諗禪師曰念佛一聲漱口三日師云大小趙州眼不能著屑量不能容人退菴即不然錦上鋪花非分外縱橫無處不稱尊且道趙州底是退菴底是或有個出來道富嫌千口少貧恨一身多山僧與伊一棒直須是個人始得何故重賞之下要求勇夫卓拄杖便起示衆舉臨濟大師上堂曰赤肉團上有一無位真人常在諸人面門出入未證據者看看時有僧出問如何是無位真人濟下禪床搊住曰道道僧擬議濟托開曰無位真人是什麼乾屎橛師云臨濟大師豁開無位真人面目立地令人證據卻被者僧一拶直得壁立萬仞更為下個注腳轉見婆心者僧不顧危亡挺身而上其奈有眼如盲負恩不少若是退菴者僧才問和聲便棒何故不見道為人須為徹殺人須見血且道與古人相去多少具眼者辨看示衆舉香嚴開法時溈山遣僧送書并拄杖到嚴接得曰蒼天蒼天僧便問和尚為甚如此嚴曰秪為春行冬令師云大小香嚴把不住被拄杖子轉不得者僧一拶幾乎屈辱大溈雖然還知退菴落處麼拍膝下座示衆舉夾山上堂曰我二十年住此山未曾舉著宗門中事僧便問承聞和尚有言二十年住此山未曾舉著宗門中事是否山曰是僧便掀倒禪床山休去明日普請掘一坑令侍者請昨日問話僧至曰老僧二十年秪說無義語今請上座打殺老僧埋向坑裡