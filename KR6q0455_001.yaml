僧提瓶挈杖何故如此復以拂子打下座機緣僧問大悲千手眼那一隻是正眼師云煙籠岸柳枝枝緑僧云不會師云雨洗溪桃朵朵紅僧禮拜云蒙和尚指示師云錯認定盤星師問僧死了燒了向什麼處去僧云者裡去師云不是者樣底汝問我僧乃問死了燒了向什麼處去師撫掌三下僧禮拜師云莫向鬼窟裡作活計僧問達磨西來教外別傳畢竟傳個什麼師云龜毛拂子僧云意旨如何師云觸破面門問弓折箭盡還有奇特事否師云飢來喫飯困來眠天童錦曇禪士問人人盡有生緣如何是和尚生緣師云常憶江南三月裡鷓鴣啼處百花香問如何是我手何似佛手師云天上有星皆拱北人間無水不朝東問如何是我腳何似驢腳師云陋巷不騎金色馬回途卻著破襴衫曇作禮師便打僧參師云山僧者裡趙州家風也沒得僧云以何物相待來者師云一個空拳僧云某甲空拳亦沒得師云非汝境界僧擬進語師便打出師舉數珠問皋亭僧云會麼僧云不會師云你也有底因甚不會僧一喝師乃連打兩掌僧問如何是衲僧眼師云瞎僧云意旨如何師云瞎問海上僧云汝曾見觀音麼僧無語師云蹉過了也又問海上風波洪大往來不易僧又無對師笑云險師將一僧鼻孔扭云為甚麼你鼻孔落在地下僧云何曾師云何故你不知香臭僧無語師云拾取好僧問假使百千劫所作業不忘為甚麼一稱南無佛罪滅河沙劫師云苦海無邊回頭是岸僧問古人作此相云萬象森羅總在其中具眼禪人試甄別看請問大師如何甄別師云全露法中王僧問仇人相見即不問賓主道合事如何師云南贍部州打鼓西瞿耶尼作拍僧問香嚴擊竹未審當時見個甚麼道理便悟去師云鼻孔原來搭上脣士問得本底人還有生死否師云生死且止喚什麼作本士擬議師劈面一掌云莫道無生死好僧問因甚古人道佛之一事我不喜聞師云天上天下唯我獨尊僧問不觸不背意旨如何師云無毛鷂子潑天飛僧問大透脫底人因甚披枷帶杻師云不是苦心人不知僧云畢竟如何師云頭頂天腳踏地行實己酉臘八日震澤龐全力設普茶同大衆請說行腳師卻之衆固懇師云豫愧道不如先哲行不逮前賢福薄德鮮識淺學荒何足言也然逼不得已未免一番露布豫乃秀水金氏子父號成丹母唐氏生於天啓壬戌四月二十七日也不幸二親早喪老祖拊養長成齠齔時嘗夢觀音大士為豫摩頂因專持菩薩名號老祖事佛行善凡至藍若豫必隨往常喜禮佛愛慕出家至十六祖有疾欲完姻事豫立志不從未幾祖乃坐脫豫痛淚失怙次年祖母亦故殯葬訖豫自念生死無常出家時至矣遂辭親族蒙送東塔禪寺禮覺如老師披剃是辛巳二十歲也至癸未請雪嶠大師結制豫充行者於方丈一日灑掃次嶠問你為什麼出家豫云父母早亡為懼生死嶠云何不參個無生死底豫便禮拜請問如何是無生死底嶠打一掌云你自去看豫悚然再拜自此疑情猛發日夜體究明春同老師往皋亭結茅遂乃佛前立願若不徹悟誓不出山終日癡呆呆地絶不與人共語少倦則痛加鞭策忘餐廢寢坐立不安一日斫柴次正迷悶間有兔躍出不覺失刀株立擬取刀忽然有省乃述偈云觸破娘生面全身沒處藏落花隨水去紅日耀山岡呈老師師甚喜是丙戌二十五歲也無幾老師圓寂完其後事聞古南牧老和尚赴梅溪開堂設戒其時路扎重兵憤志出山徑至嘉禾具禮參見南問甚處來豫云皋亭南云來作甚麼豫云乞和尚圓戒南云衣鉢完具否豫打圓相呈棒勢南云弄虛頭漢豫云和尚莫壓良為賤南云更道看豫禮拜云謝和尚慈悲期畢辭出參浮老和尚問云何處來豫云梅溪浮拈拄杖云梅溪還有者個麼豫云有浮云既有又來作麼豫舉坐具云特來呈似和尚浮便打豫禮拜云某甲罪過浮命茶留住後同道友往報恩參玉老和尚玉才見乃拈起拄杖豫便敷具作禮玉擲杖便歸臥室豫收具便出復至興善參永正老人於靜室豫問靈雲曰自從一見桃花後直至如今更不疑因甚玄沙卻道敢保老兄未徹在老人云直不藏曲豫云未審徹底人分上如何受用老人云飢來喫飯倦即打眠豫禮拜辭出老人云不得問了便休大須仔細命至堂中謁馥生大師馥德風雅厚因憩錫焉一日呈偈老人接得便打豫擬進語老人又打豫才禮拜老人直打出豫自愧見地未得超卓明春啓大悲期請入懺堂期畢復進室中禮拜老人乃問你在懺期中還見大悲菩薩麼豫云在和尚頂門放光了也老人云在老僧頂門與汝有甚交涉豫豎拳云請和尚證明老人連打三掌豫禮拜老人便一踏豫自此脫然遂呈偈云向謂無能及從今脫見知森羅休作舞萬象漫提撕老人頷之是戊子年二十七歲也時在躬師亦在堂中相與甚契一日登閣次躬問如何得遍現色身豫云更上一層樓躬云謝師答話豫云莫錯會好是秋紳襟諸護法恭請老人住永正禪院豫即同在躬隨侍時當初住豫雖在侍寮內外諸事無不兼理一日種菜次老人至問作甚麼豫云種菜老人云為衆為己豫云請和尚分析老人云將謂你道得豫以掘子打地三下老人休去豫因看幻菴師至棲真參林老和尚豫云特叩寶山便請賜棒林云老僧沒氣力豫便喝林云三十棒自領出去豫展具云人事道中合禮三拜遂至客寮乃見幻菴師敘事畢幻乞同舟至永正省覲老人舟中談及四賓主話幻便問如何是賓中賓豫云沽名釣利拋鄉井直至如今不見歸幻云如何是賓中主豫云拖泥帶水閒行走拄杖從來不離身幻云如何是主中賓豫云為憐樵子迷幽徑暫佇溪邊作指陳幻云如何是主中主豫云正令全提無向背凡情聖解豈能容幻云秪如不立賓主一句又作麼生豫云風急船行快天青日影高幻云不負吾兄親近老人豫云且莫惡口幻云贓物現在豫便喝幻乃休一日龍池萬老和尚至如如菴豫往禮問後生晚進乞垂方便萬便打豫云恁麼則某甲禮拜去也萬云你見甚麼道理豫便喝萬復打豫拂坐具便出辛卯冬老人赴當湖檀越屠公請住竺隱禪院豫充監院力為修整乃成叢席一日同完初屠公請老人觀海登陳山老人驀問水牯牛聻豫捏兩拳加頂上老人云且喜穿卻鼻孔豫轉身便行老人云一任𨁝跳豫機緣頗有不及每舉甲午春濮溪護法復請老人赴永正檀越屠公乞留主持豫切欲隨侍乃白老人舉幻菴師繼席即隨同往至老人誕日衆請上堂豫問父母未生前請師道一句老人云未問已前答汝竟豫云世尊降誕地湧金蓮和尚生日有何祥瑞老人云今日衆居士請山僧升座豫云恁麼則斷橋嫡脈流千古臨濟宗風萬派傳老人云速禮三拜豫拂具歸衆是冬大凍老人脾疾甚危體弱怕寒向因老人有願不著絲綿豫秪得違命重整衣被再三求懇乃得更換捐己衣資湊買參附蒙神醫德士幸而病愈老人志欲靜養豫同敬泉沈居士築室長水延請事奉老人即命之曰退菴是乙未春也時金明老和尚同本師老人重建普明用祖塔於興善命豫監理工畢即同送靈骨入葬己亥冬豫欲掩關呈偈老人得蒙慈允乃關居永正老人遂依韻賜詠曰巾瓶不倦喜忘春危險親徵義更深惡棒痛敲因徹骨玄言聖誨要知音幾臨禪剎憑君輔每患沉痾賴爾任有問關中何所事直須拈出祖師心值中秋夜老人舉馬祖玩月話問衆云古人恁麼道汝等各下一語看豫云金屑雖貴落眼成翳復呈頌云孤輪炯炯耀無隅今古婆心義不殊極目清光堪繼賞爭如擊碎驪龍珠老人稱善辛丑春因乏監院金明老和尚特蒙過院乃同老人命豫出關明亦賜偈曰凋林欲挽正斯時何必拘拘俟滿期放出從前真面目移風易俗好施為時檀護畢集請老人啓關豫乃問自入關來事最親經行坐臥本天真忽蒙擊碎虛空鎖躍出金烏萬象新老人云更道看豫一喝老人云也不虛過豫禮拜云謝和尚證明老人打一棒云且道是賞你罰你豫云有意氣時添意氣不風流處也風流老人遂付囑偈曰是心非有法是法本非心心法俱空寂真宗耀古今豫自愧匪材不能重任難違慈命勉爾承當是三月望日也老人命主院事豫義不能辭竭力支撐因佛相淋漓殿房坍損局面未全深自慨惜即將祖産變賣啓建山門併募善信重裝金像整葺堂房添置什物庶得小就已完老人之念雲水往來以便接納老人生平孤潔懶涉世緣適過五旬大慶即同兩序命豫主席豫乃涼德多愆何當繼紹舉請沖默法兄默亦過遜因請通濟法兄住持遂辭檀護即同老人仍歸退菴是甲辰中秋十日也次年編刻老人全録春間承金明老和尚并老人命重梓普明鴛祖語録至秋同別駕牧公衆護法送入楞嚴經坊流行豫不唯贏病且歷經險厄志願隱山終其殘喘故雖有一言半句付之烏有今因大衆堅請再三秪得復將從前醜拙分明舉似若是伶俐漢向智上座未出母胎時覷破是親見也何用繁為雖然欲躋無上毗盧頂不礙從卑漸次行衆皆歡喜禮謝而退當湖佛弟子羽生屠行符敬梓
